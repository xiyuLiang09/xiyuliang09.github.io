short_bio: >-
  <p>
    Hi, I'm Xiyu Liang. 
  </p>
  <p>  
    I obtained my bachelor degree from <a href="https://en.uestc.edu.cn/" target="_blank">University of Electronic Science and Technology of China (UESTC)</a> <img src="/assets/images/badges/uestc.png" style="width:18px; height:18px;">. Recently, I am a research internship at <a href="https://www.gatech.edu/" target="_blank">Georgia Tech</a> <img src="assets/images/GeorgiaTech.png" style="width:20px; height:20px;">, under the guidance of Prof. <a href="https://eiclab.scs.gatech.edu/pages/team.html#PI" target="_blank">Yingyan (Celine) Lin</a> . Previously, I was a research assistant in the Spatio-Temporal Big Data and Intelligence Lab, where I worked on spatio-temporal data mining under the supervision of Prof. <a href="https://scholar.google.com/citations?hl=zh-CN&user=8qdXaOkAAAAJ" target="_blank">Shuo Shang</a> and Prof. <a href="https://ieeexplore.ieee.org/author/37070108800">Lisi Chen</a>. I am also a member of ColAI (Now <a href="https://github.com/DreamSoul-AI/" target="_blank">DreamSoul-AI</a> <img src="/assets/images/dreamsoul.png" style="width:23px; height:16px;">, an AI startup), where I work closely with Dr. <a href="https://diaoenmao.com/" target="_blank">Enmao Diao</a>.
  </p>
  <p>
    My research interests primarily lie on machine learning and natural language processing. I am particularly passionate about building large-scale machine learning models and systems that achieve <span class="text-hl">lower cost</span>, <span class="text-hl">higher speed</span>, and <span class="text-hl">better performance</span>. Additionally, I am also exploring trustworthy AI, to make AI systems more <span class="text-hl">reliable and accessible</span> for humans.
  </p>

