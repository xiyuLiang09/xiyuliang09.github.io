<div class="mt-3 d-md-none"></div>
<div class="row">
    <div class="col">
        <div class="card border-0 shadow-sm bg-white">
            <div class="card-body p-4">
                <div class="row px-3 pt-3">
                    <div class="col h3">
                        About Me
                        <img src="{{ '/assets/images/helianthus.png' | relative_url }}" alt="Flower" style="height: 38px; margin-left: 8px; vertical-align: middle;">
                    </div>
                </div>
                <div class="row p-3">
                    <div class="col">
                        <div class="text-profile-bio mt-0" {% if site.data.profile.short_bio_text_justify %}style="text-align: justify;"{% endif %}>
                            {{ site.data.profile.short_bio }}
                        </div>
                        {% if site.data.profile.cv_link %}
                            <a target="_blank" href="{{ site.data.profile.cv_link | relative_url }}"><i class="fas fa-file-alt"></i> Curriculum Vitae</a> <br/>
                        {% endif %}
                        {% if site.data.profile.research_intro_link %}
                            <a target="_blank" href="{{ site.data.profile.research_intro_link | relative_url }}"><i class="fa-regular fa-file-powerpoint"></i> Research Introduction</a> (Last update: 09/2025)<br/>
                        {% endif %}
                    </div>
        
                </div>
            </div>
        </div>        
    </div>
</div>
